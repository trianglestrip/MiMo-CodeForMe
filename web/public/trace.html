<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MiMoCode Trace</title>
  <script>
    (function () {
      var h = location.hostname;
      if (h === 'localhost' || h === '[::1]') location.replace(location.href.replace(h, '127.0.0.1'));
    })();
  </script>
  <script src="/mimo-config.js"></script>
  <style>
    :root {
      --bg: #0f1419; --panel: #1a2332; --border: #2d3a4f; --text: #e6edf3; --muted: #8b9cb3;
      --accent: #3b82f6; --think: #a78bfa; --tool: #f59e0b; --output: #38bdf8;
      --user: #34d399; --ok: #22c55e; --err: #ef4444;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header {
      padding: 16px 24px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 1.15rem; }
    .sub { color: var(--muted); font-size: 0.85rem; }
    a { color: var(--accent); }
    main { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 65px); }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    .sidebar { border-right: 1px solid var(--border); padding: 16px; background: var(--panel); overflow-y: auto; max-height: calc(100vh - 65px); }
    .status { padding: 12px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border); font-size: 0.82rem; line-height: 1.6; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .dot.ok { background: var(--ok); }
    .dot.bad { background: var(--err); }
    .hint { margin-top: 14px; font-size: 0.75rem; color: var(--muted); line-height: 1.7; }
    .conv-title { margin: 16px 0 8px; font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .conv-list { display: flex; flex-direction: column; gap: 6px; }
    .conv-item {
      padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg);
      font-size: 0.78rem; cursor: pointer; text-align: left; color: var(--text);
    }
    .conv-item:hover { border-color: var(--accent); }
    .conv-item.active { border-color: var(--accent); background: rgba(59,130,246,0.08); }
    .conv-item .q { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-item .meta { color: var(--muted); font-size: 0.68rem; margin-top: 3px; }
    .timeline { padding: 20px 24px 48px; overflow-y: auto; max-height: calc(100vh - 65px); }
    .empty { color: var(--muted); text-align: center; padding: 48px; }
    .session-block { margin-bottom: 28px; }
    .session-block.dimmed { opacity: 0.45; }
    .session-head {
      padding: 10px 14px; margin-bottom: 12px; border-radius: 8px;
      background: rgba(59,130,246,0.08); border: 1px solid rgba(59,130,246,0.25);
      font-size: 0.82rem;
    }
    .session-head .sid { color: var(--muted); font-family: ui-monospace, monospace; font-size: 0.72rem; }
    .turn {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      margin-bottom: 16px; overflow: hidden;
    }
    .turn.active { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(59,130,246,0.15); }
    .turn-head {
      padding: 12px 16px; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    }
    .turn-q { font-size: 0.9rem; line-height: 1.5; }
    .turn-q::before { content: "问："; color: var(--user); font-weight: 600; }
    .turn-meta { font-size: 0.72rem; color: var(--muted); white-space: nowrap; padding-top: 2px; }
    .turn-body { padding: 8px 0; }
    .turn-foot { padding: 8px 16px 12px; font-size: 0.78rem; color: var(--ok); border-top: 1px solid var(--border); display: none; }
    .turn.done .turn-foot { display: block; }
    .flow-step { padding: 10px 16px; border-bottom: 1px solid rgba(45,58,79,0.5); }
    .flow-step:last-child { border-bottom: none; }
    .step-line { display: flex; align-items: flex-start; gap: 10px; }
    .step-num {
      flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; font-size: 0.72rem; font-weight: 600;
      display: flex; align-items: center; justify-content: center; margin-top: 1px;
    }
    .step-think .step-num { background: rgba(167,139,250,0.2); color: var(--think); }
    .step-tool .step-num { background: rgba(245,158,11,0.2); color: var(--tool); }
    .step-output .step-num { background: rgba(56,189,248,0.2); color: var(--output); }
    .step-main { flex: 1; min-width: 0; }
    .step-title { font-size: 0.88rem; line-height: 1.45; }
    .step-title .tag { font-weight: 600; margin-right: 6px; }
    .step-think .tag { color: var(--think); }
    .step-tool .tag { color: var(--tool); }
    .step-output .tag { color: var(--output); }
    .step-intent { margin-top: 4px; font-size: 0.75rem; color: var(--muted); line-height: 1.5; }
    .step-input {
      margin-top: 6px; padding: 6px 8px; background: rgba(0,0,0,0.25); border-radius: 4px;
      font-size: 0.72rem; font-family: ui-monospace, Consolas, monospace; color: var(--muted);
      white-space: pre-wrap; word-break: break-all;
    }
    .step-preview {
      margin-top: 6px; padding: 8px 10px; background: var(--bg); border-radius: 6px;
      font-size: 0.8rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
      color: var(--muted); max-height: 200px; overflow-y: auto;
    }
    .step-preview.live { color: var(--text); }
    .step-preview.live::after { content: "▌"; animation: blink 1s step-end infinite; color: var(--accent); }
    .step-preview.hidden { display: none; }
    .step-sub { margin-top: 4px; font-size: 0.75rem; color: var(--muted); }
    .step-sub.ok { color: var(--ok); }
    .step-sub.err { color: var(--err); }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>MiMoCode 调用流程</h1>
      <div class="sub">按对话（session）分组 · 思考 → 调工具 → 文字输出 · <a href="/">返回聊天</a></div>
    </div>
    <div class="sub" id="connMeta">connecting...</div>
  </header>
  <main>
    <aside class="sidebar">
      <div class="status">
        <div><span class="dot bad" id="mimoDot"></span><span id="mimoStatus">检查中...</span></div>
        <div style="margin-top:10px;color:var(--muted);font-size:0.78rem" id="cfgBox"></div>
      </div>
      <div class="conv-title">对话列表</div>
      <div class="conv-list" id="convList"></div>
      <div class="hint">
        <strong>如何知道目录里有什么？</strong><br>
        Web 把 WorkDir 传给 mimo；Agent 调用 <code>read</code> / <code>glob</code> / <code>bash</code> 等工具扫描该目录，再根据 listing 组织回答。
      </div>
    </aside>
    <section class="timeline" id="timeline">
      <div class="empty">等待提问…（在聊天页发送消息后会在此按对话显示）</div>
    </section>
  </main>
  <script>
    const SESSION_MAP_KEY = 'mimo-web-session-map'

    function resolveTraceConfig() {
      const raw = window.MIMO_TRACE_CONFIG || {}
      const port = window.location.port
      const host = window.location.hostname
      const isViteDev = (host === '127.0.0.1' || host === 'localhost') && (port === '5173' || port === '5174')
      const baseUrl = isViteDev ? '/mimo' : (raw.baseUrl || 'http://127.0.0.1:4096')
      return { ...raw, baseUrl }
    }

    const cfg = resolveTraceConfig()
    const timeline = document.getElementById('timeline')
    const convList = document.getElementById('convList')
    const mimoDot = document.getElementById('mimoDot')
    const mimoStatus = document.getElementById('mimoStatus')
    const connMeta = document.getElementById('connMeta')
    const cfgBox = document.getElementById('cfgBox')

    function authHeader() {
      return 'Basic ' + btoa(`${cfg.username || 'mimocode'}:${cfg.password || ''}`)
    }

    function apiBase() {
      const raw = (cfg.baseUrl || 'http://127.0.0.1:4096').replace(/\/$/, '')
      if (raw.startsWith('/')) return window.location.origin + raw
      return raw
    }

    function withDir(path) {
      const u = new URL(apiBase() + path)
      if (cfg.workDir) u.searchParams.set('directory', cfg.workDir)
      return u.toString()
    }

    cfgBox.textContent = `API: ${apiBase()}\nWorkDir: ${cfg.workDir || '?'}`

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    }

    function fmtTime(ts) {
      return new Date(ts).toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' })
    }

    function preview(text, max = 160) {
      const t = String(text || '').replace(/\s+/g, ' ').trim()
      if (!t) return ''
      return t.length > max ? t.slice(0, max) + '…' : t
    }

    function normPath(p) {
      return String(p || '').replace(/\\/g, '/')
    }

    const SKIP_TYPES = new Set([
      'server.heartbeat', 'server.connected', 'session.updated',
      'message.removed', 'message.part.removed', 'actor.registered', 'actor.unregistered',
      'installation.updated', 'lsp.updated',
    ])

    let activeSessionID = null
    const sessions = new Map()

    function createSessionState(sessionID) {
      const id = sessionID || '_unknown'
      const state = {
        id,
        title: '新对话',
        shortId: id.length > 12 ? id.slice(-8) : id,
        turns: 0,
        blockEl: null,
        turnsEl: null,
        currentTurn: null,
        partKinds: new Map(),
        messageRoles: new Map(),
        userMessages: new Set(),
      }
      sessions.set(id, state)
      renderConvList()
      return state
    }

    function getSession(sessionID) {
      const id = sessionID || '_unknown'
      return sessions.get(id) || createSessionState(id)
    }

    function ensureSessionBlock(ses) {
      if (ses.blockEl) return ses
      ensureEmptyGone()
      const block = document.createElement('div')
      block.className = 'session-block'
      block.dataset.session = ses.id
      block.innerHTML = `
        <div class="session-head">
          <div><strong>${esc(ses.title)}</strong></div>
          <div class="sid">session · ${esc(ses.shortId)} · WorkDir 见左侧</div>
        </div>
        <div class="session-turns"></div>`
      timeline.appendChild(block)
      ses.blockEl = block
      ses.turnsEl = block.querySelector('.session-turns')
      highlightSession(ses.id)
      return ses
    }

    function highlightSession(sessionID) {
      activeSessionID = sessionID
      for (const [id, ses] of sessions) {
        if (!ses.blockEl) continue
        ses.blockEl.classList.toggle('dimmed', id !== sessionID)
      }
      for (const btn of convList.querySelectorAll('.conv-item')) {
        btn.classList.toggle('active', btn.dataset.session === sessionID)
      }
    }

    function renderConvList() {
      convList.innerHTML = ''
      const list = [...sessions.values()].reverse()
      if (!list.length) {
        convList.innerHTML = '<div style="color:var(--muted);font-size:0.75rem">暂无对话</div>'
        return
      }
      for (const ses of list) {
        const btn = document.createElement('button')
        btn.type = 'button'
        btn.className = 'conv-item' + (ses.id === activeSessionID ? ' active' : '')
        btn.dataset.session = ses.id
        btn.innerHTML = `<span class="q">${esc(ses.title)}</span><span class="meta">${ses.turns} 轮 · ${esc(ses.shortId)}</span>`
        btn.onclick = () => {
          if (ses.blockEl) {
            highlightSession(ses.id)
          if (ses.blockEl?.scrollIntoView) ses.blockEl.scrollIntoView({ behavior: 'smooth', block: 'start' })
          }
        }
        convList.appendChild(btn)
      }
    }

    function ensureEmptyGone() {
      const empty = timeline.querySelector('.empty')
      if (empty) empty.remove()
    }

    function finishTurn(ses) {
      if (!ses.currentTurn) return
      ses.currentTurn.el.classList.remove('active')
      ses.currentTurn.el.classList.add('done')
      ses.currentTurn = null
    }

    function startTurn(ses, question) {
      finishTurn(ses)
      ensureSessionBlock(ses)
      ses.turns += 1
      const el = document.createElement('div')
      el.className = 'turn active'
      el.innerHTML = `
        <div class="turn-head">
          <div class="turn-q">${esc(question)}</div>
          <div class="turn-meta">${fmtTime(Date.now())}</div>
        </div>
        <div class="turn-body"></div>
        <div class="turn-foot">✓ 本轮完成</div>`
      ses.turnsEl.appendChild(el)
      ses.currentTurn = { el, body: el.querySelector('.turn-body'), steps: new Map(), count: 0 }
      highlightSession(ses.id)
      renderConvList()
      if (el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' })
    }

    function ensureTurn(ses) {
      if (ses.currentTurn) return ses.currentTurn
      startTurn(ses, '（未捕获问题）')
      return ses.currentTurn
    }

    function nextStepNum(turn) {
      turn.count += 1
      return turn.count
    }

    function createStep(turn, key, cls, tag, title) {
      const num = nextStepNum(turn)
      const row = document.createElement('div')
      row.className = `flow-step step-${cls}`
      row.innerHTML = `
        <div class="step-line">
          <div class="step-num">${num}</div>
          <div class="step-main">
            <div class="step-title"><span class="tag">${esc(tag)}</span><span class="step-head-text">${esc(title)}</span></div>
            <div class="step-intent hidden"></div>
            <div class="step-input hidden"></div>
            <pre class="step-preview hidden"></pre>
            <div class="step-sub hidden"></div>
          </div>
        </div>`
      turn.body.appendChild(row)
      return {
        key, cls, row,
        headEl: row.querySelector('.step-head-text'),
        intentEl: row.querySelector('.step-intent'),
        inputEl: row.querySelector('.step-input'),
        previewEl: row.querySelector('.step-preview'),
        subEl: row.querySelector('.step-sub'),
        text: '',
        done: false,
      }
    }

    function upsertStep(ses, key, cls, tag, title, opts = {}) {
      const turn = ensureTurn(ses)
      let step = turn.steps.get(key)
      if (!step) {
        step = createStep(turn, key, cls, tag, title)
        turn.steps.set(key, step)
      }

      if (opts.title != null) step.headEl.textContent = opts.title

      if (opts.intent) {
        step.intentEl.textContent = opts.intent
        step.intentEl.classList.remove('hidden')
      }
      if (opts.inputLine) {
        step.inputEl.textContent = opts.inputLine
        step.inputEl.classList.remove('hidden')
      }

      if (opts.append) {
        step.text += opts.append
        step.previewEl.textContent = step.text
        step.previewEl.classList.remove('hidden')
        if (!step.done) step.previewEl.classList.add('live')
      }
      if (opts.text != null && opts.text.length >= step.text.length) {
        step.text = opts.text
        step.previewEl.textContent = step.text
        step.previewEl.classList.remove('hidden')
      }

      if (opts.sub) {
        step.subEl.textContent = opts.sub
        step.subEl.classList.remove('hidden')
        step.subEl.classList.toggle('ok', opts.subOk === true)
        step.subEl.classList.toggle('err', opts.subOk === false)
      }

      if (opts.done) {
        step.done = true
        step.previewEl.classList.remove('live')
        if (!step.text.trim()) step.previewEl.classList.add('hidden')
        else if (cls === 'think' || cls === 'output') step.headEl.textContent = preview(step.text, 80)
      }
    }

    function parseReadDirectoryOutput(out) {
      if (typeof out !== 'string' || !out.includes('<entries>')) return null
      const typeMatch = out.match(/<type>([^<]+)<\/type>/)
      if (typeMatch?.[1] !== 'directory') return null
      const pathMatch = out.match(/<path>([^<]+)<\/path>/)
      const entriesBlock = out.match(/<entries>\s*([\s\S]*?)\s*<\/entries>/)
      const entries = entriesBlock ? entriesBlock[1].trim().split(/\s+/).filter(Boolean) : []
      const dirs = entries.filter((e) => e.endsWith('/'))
      const files = entries.filter((e) => !e.endsWith('/'))
      const lines = [`路径: ${pathMatch?.[1] || '?'}`, '']
      if (dirs.length) {
        lines.push('子目录:')
        for (const d of dirs.slice(0, 30)) lines.push('  📁 ' + d)
        if (dirs.length > 30) lines.push(`  … 共 ${dirs.length} 个目录`)
      }
      if (files.length) {
        lines.push('', '文件:')
        for (const f of files.slice(0, 24)) lines.push('  📄 ' + f)
        if (files.length > 24) lines.push(`  … 共 ${files.length} 个文件`)
      }
      return {
        sub: `listing 完成：${dirs.length} 个子目录，${files.length} 个文件`,
        text: lines.join('\n'),
        ok: true,
      }
    }

    function formatToolDisplay(tool, input, state) {
      input = input || {}
      const workDir = cfg.workDir || ''
      let title = tool
      let intent = ''
      let inputLine = ''

      if (tool === 'read') {
        const path = normPath(input.path ?? input.filePath ?? input.file ?? '.')
        const abs = path === '.' || path === './'
        title = abs ? 'read · 列出工作区根目录' : `read · ${path}`
        intent = 'Agent 用 read 读取目录 listing（工作区由 Web 的 directory 参数指定，不是猜路径）'
        inputLine = `path = ${path}\nworkDir = ${workDir || '(未配置)'}`
      } else if (tool === 'glob') {
        const pattern = input.pattern ?? '*'
        const path = normPath(input.path ?? '.')
        title = `glob · ${pattern} @ ${path}`
        intent = 'Agent 用 glob 按通配符匹配文件名'
        inputLine = `pattern = ${pattern}\npath = ${path}`
      } else if (tool === 'bash') {
        const cmd = String(input.command ?? '').split('\n')[0].slice(0, 100)
        title = `bash · ${cmd || '(命令)'}`
        intent = 'Agent 在 shell 中执行命令（如 ls / dir）'
        inputLine = String(input.command ?? '')
      } else if (tool === 'grep') {
        title = `grep · ${input.pattern ?? '?'}`
        intent = 'Agent 在文件中搜索匹配内容'
        inputLine = JSON.stringify(input, null, 2)
      } else if (tool === 'write' || tool === 'edit') {
        title = `${tool} · ${normPath(input.path ?? '?')}`
        intent = `Agent 写入/编辑文件`
        inputLine = `path = ${input.path ?? '?'}`
      } else {
        title = tool
        inputLine = JSON.stringify(input, null, 2).slice(0, 300)
      }

      const result = { sub: '执行中…', ok: undefined, text: '' }
      if (state.error) {
        result.sub = '失败: ' + String(state.error).slice(0, 160)
        result.ok = false
        return { title, intent, inputLine, ...result }
      }
      const out = state.output
      const readDir = tool === 'read' ? parseReadDirectoryOutput(out) : null
      if (readDir) return { title, intent, inputLine, ...readDir }
      if (typeof out === 'string' && out.trim()) {
        result.sub = out.includes('<entries>') ? '返回目录/文件 listing' : '返回文本'
        result.text = out.length > 800 ? out.slice(0, 800) + '\n…' : out
        result.ok = true
      } else if (out != null) {
        const s = JSON.stringify(out, null, 2)
        result.sub = '返回 JSON'
        result.text = s.length > 600 ? s.slice(0, 600) + '…' : s
        result.ok = true
      } else if (state.status === 'completed') {
        result.sub = '已完成（无输出）'
        result.ok = true
      }
      return { title, intent, inputLine, ...result }
    }

    function registerPartKind(ses, part) {
      if (part.id && (part.type === 'reasoning' || part.type === 'text')) {
        ses.partKinds.set(part.id, part.type)
      }
    }

    function handleDelta(ses, props) {
      const partID = props.partID
      const delta = props.delta
      if (!partID || delta == null) return
      const kind = ses.partKinds.get(partID) || (props.field === 'reasoning' ? 'reasoning' : 'text')
      if (kind === 'reasoning') {
        upsertStep(ses, `think:${partID}`, 'think', '思考', preview(String(delta), 80), { append: String(delta) })
        return
      }
      upsertStep(ses, `out:${partID}`, 'output', '文字输出', preview(String(delta), 80) || '…', { append: String(delta) })
    }

    function handleTextPart(ses, part) {
      const partID = part.id
      if (!partID) return
      registerPartKind(ses, part)
      const text = typeof part.text === 'string' ? part.text : ''
      const done = Boolean(part.time?.end)
      if (part.type === 'reasoning') {
        upsertStep(ses, `think:${partID}`, 'think', '思考', preview(text, 80) || '推理中…', { text, done })
        return
      }
      upsertStep(ses, `out:${partID}`, 'output', '文字输出', preview(text, 80) || '输出中…', { text, done })
    }

    function handleTool(ses, part) {
      const callID = part.callID || part.id
      if (!callID) return
      const state = part.state || {}
      const status = state.status || 'pending'
      const tool = part.tool || 'tool'
      const display = formatToolDisplay(tool, state.input, state)
      const opts = {
        title: display.title,
        intent: display.intent,
        inputLine: display.inputLine,
        done: status === 'completed' || status === 'error',
      }
      if (status === 'running') opts.sub = '执行中…'
      if (status === 'completed' || status === 'error') {
        opts.sub = display.sub
        opts.subOk = display.ok
        if (display.text) opts.text = display.text
      }
      upsertStep(ses, `tool:${callID}`, 'tool', '调用', display.title, opts)
    }

    function handleUserText(ses, messageID, text) {
      if (!messageID || !text.trim() || ses.userMessages.has(messageID)) return
      ses.userMessages.add(messageID)
      const q = text.trim()
      if (!ses.title || ses.title === '新对话') {
        ses.title = q.length > 36 ? q.slice(0, 36) + '…' : q
        if (ses.blockEl) {
          ses.blockEl.querySelector('.session-head strong').textContent = ses.title
        }
      }
      finishTurn(ses)
      startTurn(ses, q)
    }

    function eventSessionID(raw, part) {
      if (part?.sessionID) return part.sessionID
      const p = raw.properties || {}
      if (p.sessionID) return p.sessionID
      if (part?.messageID) {
        for (const ses of sessions.values()) {
          if (ses.messageRoles.has(part.messageID)) return ses.id
        }
      }
      return activeSessionID || '_unknown'
    }

    function handleEvent(raw) {
      const type = raw.type || ''
      if (SKIP_TYPES.has(type)) return

      if (type === 'session.created') {
        const sid = raw.properties?.sessionID || raw.properties?.info?.id
        if (sid) getSession(sid)
        return
      }

      if (type === 'message.part.delta') {
        const props = raw.properties || {}
        const ses = getSession(props.sessionID)
        handleDelta(ses, props)
        return
      }

      if (type === 'session.error') {
        const sid = raw.properties?.sessionID
        const ses = getSession(sid)
        upsertStep(ses, `err:${Date.now()}`, 'tool', '错误', String(raw.properties?.error || 'session error'), { done: true, subOk: false })
        return
      }

      if (type === 'session.status') {
        const sid = raw.properties?.sessionID
        const st = raw.properties?.status?.type || raw.properties?.type
        if (st === 'idle' && sid) finishTurn(getSession(sid))
        return
      }

      if (type === 'message.part.updated') {
        const part = raw.properties?.part || {}
        const ses = getSession(eventSessionID(raw, part))
        registerPartKind(ses, part)
        const role = part.messageID ? ses.messageRoles.get(part.messageID) : undefined
        if (part.type === 'tool') { handleTool(ses, part); return }
        if (part.type === 'text' && role === 'user') {
          handleUserText(ses, part.messageID, typeof part.text === 'string' ? part.text : '')
          return
        }
        if (part.type === 'text' || part.type === 'reasoning') { handleTextPart(ses, part); return }
        return
      }

      if (type === 'message.updated') {
        const info = raw.properties?.info || {}
        const sid = info.sessionID || raw.properties?.sessionID
        const ses = getSession(sid)
        if (info.id && info.role) ses.messageRoles.set(info.id, info.role)
        if (info.role === 'user') {
          const text = extractUserText(info)
          if (text) handleUserText(ses, info.id, text)
        }
        return
      }
    }

    function extractUserText(info) {
      if (Array.isArray(info.parts)) {
        for (const p of info.parts) {
          if (p?.type === 'text' && typeof p.text === 'string' && p.text.trim()) return p.text.trim()
        }
      }
      if (typeof info.content === 'string' && info.content.trim()) return info.content.trim()
      if (typeof info.text === 'string' && info.text.trim()) return info.text.trim()
      return ''
    }

    function replaySessionMessages(sessionID, messages) {
      const ses = getSession(sessionID)
      ses.replayed = true
      for (const msg of messages) {
        const role = msg.info?.role
        if (role === 'user') {
          finishTurn(ses)
          const text = (msg.parts ?? []).find((p) => p.type === 'text' && p.text)?.text?.trim()
          if (!text) continue
          if (!ses.title || ses.title === '新对话') ses.title = text.length > 36 ? text.slice(0, 36) + '…' : text
          startTurn(ses, text)
          if (msg.info?.id) ses.userMessages.add(msg.info.id)
        }
        if (role === 'assistant') {
          if (msg.info?.id) ses.messageRoles.set(msg.info.id, 'assistant')
          if (!ses.currentTurn) startTurn(ses, '（历史回放）')
          for (const part of msg.parts ?? []) {
            if (part.type === 'step-start' || part.type === 'step-finish') continue
            if (part.type === 'tool') handleTool(ses, part)
            else if (part.type === 'reasoning' || part.type === 'text') {
              handleTextPart(ses, { ...part, time: part.time ?? { end: Date.now() } })
            }
          }
          finishTurn(ses)
        }
      }
      if (ses.blockEl) ses.blockEl.querySelector('.session-head strong').textContent = ses.title
      renderConvList()
    }

    async function loadStoredSessions() {
      let raw = null
      try { raw = localStorage.getItem(SESSION_MAP_KEY) } catch (_) { return }
      if (!raw) return
      let map = {}
      try { map = JSON.parse(raw) } catch (_) { return }
      const entries = Object.values(map).sort((a, b) => (b.updatedAt ?? 0) - (a.updatedAt ?? 0))
      for (const entry of entries) {
        if (!entry?.sessionId) continue
        try {
          const res = await fetch(withDir(`/session/${encodeURIComponent(entry.sessionId)}/message`), {
            headers: { Authorization: authHeader() },
          })
          if (!res.ok) continue
          const messages = await res.json()
          if (Array.isArray(messages) && messages.length) {
            const ses = getSession(entry.sessionId)
            if (entry.title) ses.title = entry.title
            replaySessionMessages(entry.sessionId, messages)
          }
        } catch (_) {}
      }
    }

    function snapshotTimeline() {
      return [...timeline.querySelectorAll('.session-block')].map((block) => ({
        session: block.dataset.session,
        turns: [...block.querySelectorAll('.turn')].map((turn) => ({
          question: turn.querySelector('.turn-q')?.textContent ?? '',
          done: turn.classList.contains('done'),
        })),
      }))
    }

    function mockEvents() {
      const ses = 'ses_sim001'
      const msgUser = 'msg_user001'
      const msgAsst = 'msg_asst001'
      const prtThink = 'prt_think001'
      const prtTool = 'prt_tool001'
      const prtOut = 'prt_out001'
      const callID = 'call_read001'
      return [
        { type: 'message.updated', properties: { info: { id: msgUser, role: 'user', sessionID: ses, parts: [{ type: 'text', text: '当前目录有哪些文件' }] } } },
        { type: 'message.part.updated', properties: { part: { id: prtThink, type: 'reasoning', messageID: msgAsst, sessionID: ses, text: '需要先列出工作区目录。', time: { end: Date.now() } } } },
        { type: 'message.part.updated', properties: { part: { id: prtTool, type: 'tool', callID, tool: 'read', messageID: msgAsst, sessionID: ses, state: { status: 'running', input: { path: '.' } } } } },
        { type: 'message.part.updated', properties: { part: { id: prtTool, type: 'tool', callID, tool: 'read', messageID: msgAsst, sessionID: ses, state: { status: 'completed', input: { path: '.' }, output: '<path>D:\\\\proj</path> <type>directory</type> <entries> packages/ web/ README.md </entries>' } } } },
        { type: 'message.part.updated', properties: { part: { id: prtOut, type: 'text', messageID: msgAsst, sessionID: ses, text: '当前目录包含 packages、web、README.md 等。', time: { end: Date.now() } } } },
        { type: 'session.status', properties: { sessionID: ses, status: { type: 'idle' } } },
      ]
    }

    function runSimulation() {
      connMeta.textContent = '模拟模式'
      mimoStatus.textContent = '模拟测试'
      mimoDot.className = 'dot ok'
      for (const e of mockEvents()) handleEvent(e)
      return snapshotTimeline()
    }

    window.__traceHandleEvent = handleEvent
    window.__traceGetSnapshot = snapshotTimeline
    window.__traceRunSimulation = runSimulation

    async function checkHealth() {
      try {
        const res = await fetch(withDir('/global/health'), { cache: 'no-store' })
        const ok = res.ok
        mimoDot.className = 'dot ' + (ok ? 'ok' : 'bad')
        mimoStatus.textContent = ok ? 'mimo serve 就绪' : `health ${res.status}`
        return ok
      } catch (_) {
        mimoDot.className = 'dot bad'
        mimoStatus.textContent = 'mimo serve 未连接'
        return false
      }
    }

    async function connectStream() {
      connMeta.textContent = '订阅 /event …'
      while (true) {
        try {
          const res = await fetch(withDir('/event'), {
            headers: { Authorization: authHeader(), Accept: 'text/event-stream' },
          })
          if (!res.ok || !res.body) throw new Error(`HTTP ${res.status}`)
          connMeta.textContent = '已连接 · 按 session 分组'
          mimoDot.className = 'dot ok'
          const reader = res.body.getReader()
          const decoder = new TextDecoder()
          let buffer = ''
          while (true) {
            const { done, value } = await reader.read()
            if (done) break
            buffer += decoder.decode(value, { stream: true })
            const parts = buffer.split('\n\n')
            buffer = parts.pop() || ''
            for (const block of parts) {
              const data = block.split('\n').filter((l) => l.startsWith('data:')).map((l) => l.slice(5).trimStart()).join('\n')
              if (!data) continue
              try { handleEvent(JSON.parse(data)) } catch (_) {}
            }
          }
        } catch (e) {
          const msg = e instanceof Error ? e.message : String(e)
          connMeta.textContent = `SSE 断开: ${msg} · 3s 重连`
          mimoDot.className = 'dot bad'
          await new Promise((r) => setTimeout(r, 3000))
        }
      }
    }

    async function boot() {
      await checkHealth()
      await loadStoredSessions()
      setInterval(checkHealth, 8000)
      connectStream()
    }

    if (new URLSearchParams(location.search).get('simulate') === '1') {
      runSimulation()
    } else {
      boot()
    }
  </script>
</body>
</html>
